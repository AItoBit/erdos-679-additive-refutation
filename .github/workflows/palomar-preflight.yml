name: Palomar complete mechanical preflight
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full immutable package commit SHA to verify
        required: true
        type: string
      request_id:
        description: Exactly twelve lowercase alphanumeric characters
        required: true
        type: string
      options:
        description: JSON containing comparator_config_path and human-confirmed authorization_relationship
        required: true
        type: string
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ inputs.options }}
