version: v0.4
project:
  name: "Additive strengthening of Erdos problem 679: a known refutation"
  description: >-
    For every real additive constant C and natural cutoff K, every sufficiently
    large natural n admits K < k < n with omega(n-k) at least
    log(k)/log(log(k)) + C. Here omega counts distinct prime factors.
    This independently implemented proof uses a fixed primorial residue window,
    elementary Chebyshev estimates and Stirling bounds. It refutes the known
    additive strengthening and does not resolve the main multiplicative question.
    No mathematical novelty is claimed.
  # Human project attribution for task direction and accepted responsibility.
  # This does not claim manual proof generation; see automation.notes.
  authors: [AItoBit]
  responsible_maintainers: [AItoBit]
  license: Apache-2.0
classification:
